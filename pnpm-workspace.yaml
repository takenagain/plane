packageExtensions:
  # tiptap-markdown imports ProseMirror through @tiptap/pm but omits it from
  # its published peer dependencies. Make the existing editor dependency visible
  # from pnpm's isolated package directory so the space bundle resolves it.
  tiptap-markdown@0.9.0:
    peerDependencies:
      "@tiptap/pm": "^3.0.1"

overrides:
  # Force a single React across the whole graph. With node-linker=isolated,
  # auto-install-peers and resolution-mode=highest, a dependency still declaring a
  # React 18 peer can otherwise pull in a second copy, which surfaces as an invalid
  # hook call rather than as an install error. The vite `resolve.dedupe` entries only
  # cover the three app client bundles, not the SSR build, the tsdown package builds
  # or Storybook.
  react: "catalog:"
  react-dom: "catalog:"
  react-is: "catalog:"
  "@types/react": "catalog:"
  "@types/react-dom": "catalog:"
  # @makeplane/propel and @plane/blocks must share one Base UI copy: two copies mean
  # two React contexts, so a blocks part rendered inside a propel root cannot see it.
  "@base-ui/react": "catalog:"
  "@tiptap/starter-kit": "catalog:"
  express: "catalog:"
  # @react-router/serve v8 needs Express 5 — it mounts with the Express 5 path syntax
  # `app.all("/{*splat}")`, which Express 4 silently fails to match, 404ing every route.
  # The catalog stays on Express 4 for apps/live, which depends on express-ws (Express 4 only).
  "@react-router/serve>express": "^5.2.1"
  mdast-util-to-hast: 13.2.1
  valibot: 1.4.2
  glob: 13.0.6
  # EXACT pin, bump the number. Stack-exhaustion DoS (CVE-2026-102276, -102278, fixed
  # 5.0.11) reachable via serve>serve-handler>minimatch.
  brace-expansion: 5.0.12
  nanoid: 5.1.16
  esbuild: 0.28.1
  "@babel/core": 8.0.1
  "@babel/helpers": 8.0.0
  "@babel/runtime": 7.29.7
  chokidar: 5.0.0
  # EXACT pin, bump the number. CVE-2026-104847 fixed in 1.42.3; 1.42.6 needs
  # prosemirror-model ^1.25.12, pinned below so the graph keeps one model copy
  # (two copies break ProseMirror's instanceof checks).
  prosemirror-view: 1.42.6
  prosemirror-model: 1.25.12
  "@types/express": 4.17.23
  typescript: "catalog:"
  vite: "catalog:"
  qs: 6.16.0
  diff: 9.0.0
  "webpack": 5.108.3
  lodash-es: "catalog:"
  lodash: 4.18.1
  # CVE-2026-111758 (DoS via unclosed link reference definitions) fixed in 14.3.3.
  markdown-it: 14.3.3
  "rollup": 4.62.2
  "minimatch@3": 3.1.5
  "minimatch@10": 10.2.5
  "serialize-javascript": 7.0.7
  "ajv@6": 6.15.0
  "ajv@8": 8.20.0
  "undici@7": 7.30.0
  flatted: 3.4.2
  picomatch: 4.0.4
  "yaml@1": 1.10.3
  "yaml@2": 2.9.0
  # Pinned for Express 4 (apps/live), which needs path-to-regexp ~0.1.12.
  path-to-regexp: 0.1.13
  # Express 5's router needs path-to-regexp 8; the pin above would otherwise reach it
  # and break route matching at startup with `pathRegexp.match is not a function`.
  "router>path-to-regexp": "^8.4.2"
  "defu": 6.1.7
  postcss: 8.5.25
  # No 6.x fix for CVE-2026-104844 (fixed 7.1.6). @tailwindcss/typography pins
  # 6.0.10 but only uses parser()/selector(); 7.0.0's sole break is safe insertion.
  postcss-selector-parser: 7.1.6
  axios: "catalog:"
  # CVE-2026-111755 / CVE-2026-111756 fixed in 1.16.1.
  follow-redirects: "1.16.1"
  uuid: "catalog:"
  # EXACT pin: bump the number, never widen -- 4.x breaks ajv's ^3.0.1 (the only
  # consumer here). Floor is 3.1.8, not 3.1.7: it also fixes GHSA-hrr3-gc8f-f4qj,
  # which is MEDIUM so the HIGH/CRITICAL scan won't catch a slip back.
  fast-uri: 3.1.8
  "js-yaml@4": 4.3.2
  linkify-it: 5.0.2
  body-parser: 1.20.6
  tmp: 0.2.7
  form-data: 4.0.6
  "ws@8": 8.21.0
  "ws@7": 7.5.11
  "@opentelemetry/core": 2.8.0
  "@opentelemetry/resources": 2.8.0
  "@opentelemetry/sdk-trace-base": 2.8.0
  morgan: 1.12.1
  # Prototype pollution and unbounded query-cache growth, both reachable as DoS
  # (CVE-2026-73088 / CVE-2026-73089). browserslist is build tooling only
  # (babel/postcss/vite), but the runtime images copy node_modules wholesale, so
  # it lands in the scanned surface.
  browserslist: ">=4.28.7"
  # CVE-2026-114141/114143/114144 cover all toml <= 5.0.0. Version 5 keeps
  # the only used API (Toml.parse()) and stops silently rounding unsafe integers.
  toml: ">=5.0.1 <6"
  # The lockfile predates the 2026-10-05 advisories below.
  # serve 14.2.5 pins compression 1.8.1 exactly; CVE-2026-87776 fixed in 1.8.2.
  compression: "catalog:"
  # express ~2.0.7 / ^2.0.7 already allow it; CVE-2026-90711 (critical) fixed in 2.0.8.
  proxy-addr: ">=2.0.8 <3"
  # postcss and friends; CVE-2026-93749 fixed in 1.2.2.
  source-map-js: ">=1.2.2 <2"
  # oxfmt 0.35.0 pins tinypool 2.1.0 exactly; CVE-2026-104848/104849 (critical) fixed in 2.1.2.
  "tinypool@2": ">=2.1.2 <3"

  "js-yaml": 5.2.0
  "happy-dom": 20.10.6
  "tar-fs": 3.1.3
  "prosemirror-changeset": 2.4.1
  "prosemirror-history": 1.5.0
  "prosemirror-inputrules": 1.5.1
  "prosemirror-markdown": 1.13.4
  "prosemirror-menu": 1.3.2
  "prosemirror-state": 1.4.4
  "prosemirror-tables": 1.8.5
  "prosemirror-transform": 1.12.0
  fast-uri@<3.1.5: 4.1.0
allowBuilds:
  "@parcel/watcher": true
  "@swc/core": true
  esbuild: true
  msgpackr-extract: true
  turbo: true
  sharp: false

minimumReleaseAgeExclude:
  - "@storybook/addon-docs@10.4.6"
  - "@storybook/builder-vite@10.4.6"
  - "@storybook/csf-plugin@10.4.6"
  - "@storybook/react-dom-shim@10.4.6"
  - "@storybook/react-vite@10.4.6"
  - "@storybook/react@10.4.6"
  - storybook@10.4.6
  - "@makeplane/propel@0.7.3"

peerDependencyRules:
  allowedVersions:
    # Peer ranges predate React 19, but neither package uses anything React 19 removed
    # (no findDOMNode, no string refs, no element.ref reads). Recorded here so the
    # acceptance is explicit rather than hidden behind the global
    # strict-peer-dependencies=false.
    "react-masonry-component>react": "19"
    "use-font-face-observer>react": "19"
