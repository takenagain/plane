name: "CodeQL"

on:
  workflow_dispatch:
  push:
    branches: ["preview", "staging", "canary", "master"]
  pull_request:
    branches: ["preview", "staging", "canary", "master"]

jobs:
  skip-on-forks:
    if: ${{ github.repository != 'makeplane/plane' }}
    name: Skip on forks
    runs-on: ubuntu-latest
    steps:
      - name: Explain skip
        run: echo "Skipping CodeQL on fork ${GITHUB_REPOSITORY}; code scanning uploads require upstream repository permissions."

  analyze:
    if: ${{ github.repository == 'makeplane/plane' }}
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ["python", "javascript"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
