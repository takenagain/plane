name: "CodeQL"

on:
  workflow_dispatch:
  push:
    branches: ["preview", "staging", "canary", "master"]
  pull_request:
    branches: ["preview", "staging", "canary", "master"]

jobs:
  skip-on-forks:
    if: ${{ github.repository != 'makeplane/plane' }}
    name: Skip on forks
    runs-on: ubuntu-latest
    steps:
      - name: Explain skip
        run: echo "Skipping CodeQL on fork ${GITHUB_REPOSITORY}; code scanning uploads require upstream repository permissions."

  analyze:
    if: ${{ github.repository == 'makeplane/plane' }}
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    env:
      CODEQL_ACTION_FILE_COVERAGE_ON_PRS: "false"

    strategy:
      fail-fast: false
      matrix:
        language: ["python", "javascript"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"
