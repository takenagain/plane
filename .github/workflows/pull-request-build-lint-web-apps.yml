name: Build, lint and test web apps

on:
  workflow_dispatch:
  push:
    branches:
      - staging
    paths:
      - "apps/admin/**"
      - "apps/live/**"
      - "apps/space/**"
      - "apps/web/**"
      - "packages/**"
      - "patches/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".node-version"
      - ".npmrc"
      - ".github/workflows/pull-request-build-lint-web-apps.yml"
  pull_request:
    branches:
      - "preview"
      - "staging"
    types:
      - "opened"
      - "synchronize"
      - "reopened"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  authorize:
    name: Authorize CI
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/authorize-pr

  # Format check has no build dependencies - run immediately in parallel
  check-format:
    name: check:format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: authorize
    if: |
      always() &&
      (needs.authorize.result == 'success' || github.event_name != 'pull_request') &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    env:
      TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      TURBO_SCM_HEAD: ${{ github.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 50
          filter: blob:none

      - name: Set Turbo range
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "TURBO_SCM_BASE=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_ENV"
            echo "TURBO_SCM_HEAD=${{ github.sha }}" >> "$GITHUB_ENV"
          else
            echo "TURBO_SCM_BASE=${TURBO_SCM_BASE:-$(git rev-parse HEAD^)}" >> "$GITHUB_ENV"
            echo "TURBO_SCM_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.15.0
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.STORE_PATH }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm turbo run check:format --affected

  # Build packages - required for lint and type checks
  build:
    name: Build packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: authorize
    if: |
      always() &&
      (needs.authorize.result == 'success' || github.event_name != 'pull_request') &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    env:
      TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      TURBO_SCM_HEAD: ${{ github.sha }}
      NODE_OPTIONS: "--max-old-space-size=4096"
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 50
          filter: blob:none

      - name: Set Turbo range
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "TURBO_SCM_BASE=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_ENV"
            echo "TURBO_SCM_HEAD=${{ github.sha }}" >> "$GITHUB_ENV"
          else
            echo "TURBO_SCM_BASE=${TURBO_SCM_BASE:-$(git rev-parse HEAD^)}" >> "$GITHUB_ENV"
            echo "TURBO_SCM_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.15.0
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.STORE_PATH }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Restore Turbo cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.event.pull_request.base.sha }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.event.pull_request.base.sha }}-
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm turbo run build --affected

      - name: Save Turbo cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.event.pull_request.base.sha }}-${{ github.sha }}

  # Lint check - no build dependency, OxLint is a standalone Rust binary
  check-lint:
    name: check:lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: authorize
    if: |
      always() &&
      (needs.authorize.result == 'success' || github.event_name != 'pull_request') &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    env:
      TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      TURBO_SCM_HEAD: ${{ github.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 50
          filter: blob:none

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.15.0
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.STORE_PATH }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run check:lint
        run: pnpm turbo run check:lint --affected

  # Type check depends on build artifacts
  check-types:
    name: check:types
    runs-on: ubuntu-latest
    needs: [authorize, build]
    timeout-minutes: 15
    if: |
      always() &&
      (needs.authorize.result == 'success' || github.event_name != 'pull_request') &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    env:
      TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      TURBO_SCM_HEAD: ${{ github.sha }}
      NODE_OPTIONS: "--max-old-space-size=4096"
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 50
          filter: blob:none

      - name: Set Turbo range
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "TURBO_SCM_BASE=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_ENV"
            echo "TURBO_SCM_HEAD=${{ github.sha }}" >> "$GITHUB_ENV"
          else
            echo "TURBO_SCM_BASE=${TURBO_SCM_BASE:-$(git rev-parse HEAD^)}" >> "$GITHUB_ENV"
            echo "TURBO_SCM_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.15.0
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.STORE_PATH }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Restore Turbo cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.event.pull_request.base.sha }}-${{ github.sha }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run check:types
        run: pnpm turbo run check:types --affected

  test:
    name: Unit and integration tests
    runs-on: ubuntu-latest
    needs: [authorize, build]
    timeout-minutes: 15
    if: |
      always() &&
      needs.build.result == 'success' &&
      (needs.authorize.result == 'success' || github.event_name != 'pull_request') &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    services:
      valkey:
        image: valkey/valkey:9.1.3-alpine3.24@sha256:bf09d58e96d6b4524a15396b65b242bbe18beebbcc15a04d8ee75ddac62fae0b
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 6
    env:
      TEST_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm turbo run build --filter='./packages/*'

      - name: Run web unit tests
        run: pnpm --filter web test:unit

      - name: Run live unit and Valkey integration tests
        run: pnpm --filter live test

      - name: Run codemod unit and CLI tests
        run: pnpm --filter @plane/codemods test

      - name: Run Storybook documentation tests
        run: pnpm --filter @plane/ui test

      - name: Build UI Storybook
        run: pnpm --filter @plane/ui build-storybook --disable-telemetry
