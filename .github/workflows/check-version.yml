name: Version Change Before Release

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version

      - name: Get PR Branch version
        run: echo "PR_VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_ENV

      # Dependabot matches pip advisories for "plane" against this version, so it must not drift.
      - name: Check API version matches package.json
        run: |
          API_VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('apps/api/pyproject.toml', 'rb'))['project']['version'])")
          if [ "$API_VERSION" != "$PR_VERSION" ]; then
            echo "apps/api/pyproject.toml version ($API_VERSION) must match package.json ($PR_VERSION). Bump it and run 'uv lock'."
            exit 1
          fi

      - name: Fetch base branch
        run: git fetch origin "${{ github.event.pull_request.base.ref }}" --depth=1

      - name: Get base branch version
        run: |
          BASE_REF="${{ github.event.pull_request.base.ref }}"
          git show "origin/${BASE_REF}:package.json" > /tmp/base-package.json
          echo "BASE_VERSION=$(node -p "require('/tmp/base-package.json').version")" >> $GITHUB_ENV

      - name: Compare branch versions
        run: |
          echo "Comparing versions: PR version is $PR_VERSION, base (${BASE_REF}) version is $BASE_VERSION"
          if [ "$PR_VERSION" == "$BASE_VERSION" ]; then
            echo "Version in PR branch is the same as the base branch. Failing the CI."
            exit 1
          else
            echo "Version check passed. Versions are different."
          fi
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_VERSION: ${{ env.PR_VERSION }}
          BASE_VERSION: ${{ env.BASE_VERSION }}
