name: E2E Tests

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "preview"
      - "staging"
    types:
      - "opened"
      - "synchronize"
      - "ready_for_review"
      - "review_requested"
      - "reopened"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-tests:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Create root .env from example
        run: cp .env.example .env

      - name: Create API .env for docker-compose
        run: |
          cp apps/api/.env.example apps/api/.env
          SECRET_KEY=$(tr -dc 'a-z0-9' < /dev/urandom | head -c50)
          echo "SECRET_KEY=\"$SECRET_KEY\"" >> apps/api/.env
          echo 'USE_MINIO=1' >> apps/api/.env
          echo 'WEB_URL=http://localhost:8081' >> apps/api/.env
          echo 'APP_BASE_URL=http://localhost:8081' >> apps/api/.env
          echo 'ADMIN_BASE_URL=http://localhost:8081' >> apps/api/.env
          echo 'SPACE_BASE_URL=http://localhost:8081' >> apps/api/.env

      - name: Build and start Plane stack
        run: docker compose -f docker-compose.yml up -d --build --wait
        timeout-minutes: 20

      - name: Wait for API to be ready
        run: |
          echo "Waiting for API health..."
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8081/api/instances/ > /dev/null 2>&1; then
              echo "API is ready"
              exit 0
            fi
            echo "Attempt $i/60 - waiting 5s..."
            sleep 5
          done
          echo "API did not become ready in time"
          docker compose -f docker-compose.yml logs api proxy
          exit 1

      - name: Set up Node.js
        uses: actions/setup-node@v6

      - name: Enable Corepack and pnpm
        run: corepack enable pnpm

      - name: Install E2E dependencies
        working-directory: e2e
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: e2e
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: e2e
        run: pnpm exec playwright test
        env:
          CI: "true"
          BASE_URL: http://localhost:8081

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: test-results
          path: e2e/test-results/
          retention-days: 14

      - name: Dump container logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml logs --tail=200
