name: Publish Docker Image to GHCR

on:
    push:
        branches:
            - preview
            - staging
    workflow_dispatch:
        inputs:
            branch:
                description: "Branch to build from"
                required: false
                default: "staging"

permissions:
    contents: read
    packages: write

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - image_name: plane-frontend
                      dockerfile: ./apps/web/Dockerfile.web
                      context: .
                    - image_name: plane-space
                      dockerfile: ./apps/space/Dockerfile.space
                      context: .
                    - image_name: plane-admin
                      dockerfile: ./apps/admin/Dockerfile.admin
                      context: .
                    - image_name: plane-live
                      dockerfile: ./apps/live/Dockerfile.live
                      context: .
                    - image_name: plane-backend
                      dockerfile: ./apps/api/Dockerfile.api
                      context: ./apps/api
                    - image_name: plane-proxy
                      dockerfile: ./apps/proxy/Dockerfile.ce
                      context: ./apps/proxy

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Set image name
              id: image
              run: |
                  owner="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
                  repo="$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')"
                  echo "name=ghcr.io/${owner}/${repo}/${{ matrix.image_name }}" >> "$GITHUB_OUTPUT"

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

            - name: Log in to GHCR
              uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Docker metadata
              id: meta
              uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
              with:
                  images: ${{ steps.image.outputs.name }}
                  tags: |
                      type=ref,event=branch
                      type=sha,format=short

            - name: Build and push
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              with:
                  context: ${{ matrix.context }}
                  file: ${{ matrix.dockerfile }}
                  push: true
                  platforms: linux/amd64
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
