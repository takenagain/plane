name: Desktop app

on:
  workflow_dispatch:
  push:
    tags:
      - "v*-rc.*"
  pull_request:
    branches:
      - "preview"
      - "staging"
    paths:
      - "apps/desktop/**"
      - ".github/workflows/desktop.yml"
    types:
      - "opened"
      - "synchronize"
      - "reopened"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  authorize:
    name: Authorize CI
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/authorize-pr

  build:
    name: Build desktop app
    runs-on: ubuntu-latest
    needs: authorize
    if: |
      always() &&
      (needs.authorize.result == 'success' || github.event_name != 'pull_request')
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/desktop/go.mod
          cache-dependency-path: apps/desktop/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"

      - name: Install Linux systray dependencies
        run: sudo apt-get update && sudo apt-get install -y libayatana-appindicator3-dev libgtk-3-dev

      - name: Build frontend
        working-directory: apps/desktop/frontend
        run: npm ci && npm run build

      - name: Build Go backend
        working-directory: apps/desktop
        run: go build -v .

      - name: Vet Go code
        working-directory: apps/desktop
        run: go vet ./...
