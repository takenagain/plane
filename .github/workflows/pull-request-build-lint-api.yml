name: Build and lint API

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "preview"
      - "staging"
    types:
      - "opened"
      - "synchronize"
      - "ready_for_review"
      - "review_requested"
      - "reopened"
    paths:
      - "apps/api/**"
      - ".github/workflows/pull-request-build-lint-api.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  authorize:
    name: Authorize CI
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/authorize-pr

  lint-api:
    name: Lint API
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: authorize
    if: |
      always() &&
      (needs.authorize.result == 'success' || github.event_name != 'pull_request') &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    steps:
      - uses: actions/checkout@v6
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          # uv version comes from [tool.uv] required-version.
          version-file: "apps/api/pyproject.toml"
          # Same patch release as the production image (python:3.12.12-alpine).
          python-version: "3.12.12"
          enable-cache: true
          cache-dependency-glob: "apps/api/uv.lock"
      # Only the dev group (ruff) is needed to lint. --locked still fails the
      # job if uv.lock is out of date with pyproject.toml.
      - name: Install API Dependencies
        working-directory: apps/api
        run: uv sync --locked --only-group dev
      # No --fix: fixable violations must fail the job, not be rewritten on the runner.
      - name: Lint apps/api
        working-directory: apps/api
        run: uv run --no-sync ruff check .
