name: Build and lint API

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "preview"
    types:
      - "opened"
      - "synchronize"
      - "ready_for_review"
      - "review_requested"
      - "reopened"
    paths:
      - "apps/api/**"
      - ".github/workflows/pull-request-build-lint-api.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-api:
    name: Lint API
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.x"
          cache: "pip"
          cache-dependency-path: "apps/api/requirements.txt"
      - name: Install Pylint
        run: python -m pip install ruff
      - name: Install API Dependencies
        run: cd apps/api && pip install -r requirements.txt
      - name: Lint apps/api
        run: ruff check apps/api

  test-api:
    name: Test API and DB
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    services:
      postgres:
        image: postgres:15.7-alpine
        env:
          POSTGRES_USER: plane
          POSTGRES_PASSWORD: plane
          POSTGRES_DB: plane
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U plane -d plane"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://plane:plane@localhost:5432/plane
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: test-secret-key
      USE_MINIO: "0"
      WEB_URL: http://localhost:8000
      ADMIN_BASE_URL: http://localhost:3001
      APP_BASE_URL: http://localhost:3000
      SPACE_BASE_URL: http://localhost:3002
      EMAIL_HOST: localhost
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.x"
          cache: "pip"
          cache-dependency-path: "apps/api/requirements/test.txt"
      - name: Install API Test Dependencies
        run: cd apps/api && pip install -r requirements/test.txt
      - name: Run Django system checks
        run: cd apps/api && python manage.py check --settings=plane.settings.test
      - name: Run API and DB tests
        run: cd apps/api && pytest plane/tests/unit plane/tests/contract plane/tests/smoke
